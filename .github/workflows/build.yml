name: Build Kernel S9 - Android 15 Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Gunakan versi Ubuntu spesifik agar library cocok
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: hurt21-pixel/Lineageos-android_kernel_samsung_exynos9810
          ref: lineage-20

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev lld llvm qemu-user-static

      - name: Setup Clang 15 (Fixed Link)
        run: |
          mkdir -p clang-15
          # Menggunakan link langsung ke archive r450784d yang lebih stabil
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz
          tar -xzf clang-r450784d.tar.gz -C clang-15
          echo "$(pwd)/clang-15/bin" >> $GITHUB_PATH

      - name: Integrasi KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          CONF=arch/arm64/configs/exynos9810-starlte_defconfig
          if [ -f $CONF ]; then
            echo "CONFIG_KPROBES=y" >> $CONF
            echo "CONFIG_KPROBE_EVENTS=y" >> $CONF
            echo "CONFIG_OVERLAY_FS=y" >> $CONF
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export PATH=$(pwd)/clang-15/bin:$PATH
          
          make O=out exynos9810-starlte_defconfig
          yes "" | make O=out oldconfig
          
          # Gunakan perintah build yang lebih simpel agar tidak bentrok dengan library sistem
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            KCPPFLAGS="-Wno-error"

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S9-A15-Fixed
          path: out/arch/arm64/boot/Image.gz-dtb
          
