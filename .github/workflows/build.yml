name: Build KernelSU Next
on:
  workflow_dispatch: # Agar bisa dijalankan manual klik tombol

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Integrasi KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -
          # Mengaktifkan KPROBES otomatis di defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/exynos9810-starlte_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/exynos9810-starlte_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/exynos9810-starlte_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out exynos9810-starlte_defconfig
          make -j$(nproc) O=out CC=clang

      - name: Upload Hasil
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-S9-KSU-Next
          path: out/arch/arm64/boot/Image.gz-dtb
          
