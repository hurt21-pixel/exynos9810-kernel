name: Build Kernel S9 - Indra-id KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Indra-id/android_kernel_samsung_universal9810
          ref: udc # Branch ini yang paling stabil untuk Android 15

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev lld llvm

      - name: Setup Clang 19 (Google Prebuilt)
        run: |
          mkdir -p clang-19
          curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang-19
          echo "$(pwd)/clang-19/bin" >> $GITHUB_PATH

      - name: Integrasi KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          # Patch otomatis defconfig agar KSU aktif
          CONF=arch/arm64/configs/exynos9810-starlte_defconfig
          echo "CONFIG_KPROBES=y" >> $CONF
          echo "CONFIG_KPROBE_EVENTS=y" >> $CONF
          echo "CONFIG_OVERLAY_FS=y" >> $CONF

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export PATH=$(pwd)/clang-19/bin:$PATH
          
          # Jawab otomatis semua pertanyaan config baru
          make O=out exynos9810-starlte_defconfig
          yes "" | make O=out oldconfig
          
          # Proses Masak
          make -j$(nproc) O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S9-Indra-KSU
          path: out/arch/arm64/boot/Image.gz-dtb
          
