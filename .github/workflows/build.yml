name: Build Kernel S9 - Final Hope
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: hurt21-pixel/Lineageos-android_kernel_samsung_exynos9810
          ref: lineage-20

      - name: Install LLVM & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm aarch64-linux-gnu-gcc

      - name: Integrasi KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          CONF=arch/arm64/configs/exynos9810-starlte_defconfig
          if [ -f $CONF ]; then
            echo "CONFIG_KPROBES=y" >> $CONF
            echo "CONFIG_KPROBE_EVENTS=y" >> $CONF
            echo "CONFIG_OVERLAY_FS=y" >> $CONF
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          # Menggunakan GCC sebagai pendamping Clang bawaan Ubuntu
          make O=out exynos9810-starlte_defconfig
          yes "" | make O=out oldconfig
          
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration" \
            KCPPFLAGS="-Wno-error"

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S9-Final-Result
          path: out/arch/arm64/boot/Image.gz-dtb
          
