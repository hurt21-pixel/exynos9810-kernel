name: Build Kernel S9 - Clang 15 Stable
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: hurt21-pixel/Lineageos-android_kernel_samsung_exynos9810
          ref: lineage-20 # Sesuai branch di repo fork kamu

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev lld llvm

      - name: Setup Clang 15
        run: |
          mkdir -p clang-15
          # Menggunakan prebuilt Clang 15 dari Google
          curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang-15
          echo "$(pwd)/clang-15/bin" >> $GITHUB_PATH

      - name: Integrasi KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          CONF=arch/arm64/configs/exynos9810-starlte_defconfig
          if [ -f $CONF ]; then
            echo "CONFIG_KPROBES=y" >> $CONF
            echo "CONFIG_KPROBE_EVENTS=y" >> $CONF
            echo "CONFIG_OVERLAY_FS=y" >> $CONF
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export PATH=$(pwd)/clang-15/bin:$PATH
          
          # Konfigurasi Defconfig
          make O=out exynos9810-starlte_defconfig
          # Jawab otomatis input agar tidak Aborted
          yes "" | make O=out oldconfig
          
          make -j$(nproc) O=out \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            KCFLAGS="-Wno-error" \
            KCPPFLAGS="-Wno-error"

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S9-Clang15-KSU
          path: out/arch/arm64/boot/Image.gz-dtb
          
