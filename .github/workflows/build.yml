name: Build KernelSU Original
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Integrasi KernelSU Original
        run: |
          # Menggunakan script resmi KernelSU Original
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Paksa aktifkan config di semua file defconfig yang mungkin
          find arch/arm64/configs/ -name "*defconfig" -type f -exec sh -c '
            echo "CONFIG_KPROBES=y" >> "$1"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$1"
            echo "CONFIG_OVERLAY_FS=y" >> "$1"
          ' -- {} \;

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Mencari defconfig S9 (starlte) atau universal9810
          if [ -f arch/arm64/configs/exynos9810-starlte_defconfig ]; then
            CONF=exynos9810-starlte_defconfig
          elif [ -f arch/arm64/configs/universal9810_defconfig ]; then
            CONF=universal9810_defconfig
          else
            CONF=$(ls arch/arm64/configs/ | grep -i "defconfig" | head -n 1)
          fi
          
          echo "Menggunakan config: $CONF"
          make O=out $CONF
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=clang

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S9-KSU-Original
          path: out/arch/arm64/boot/Image.gz-dtb
          
