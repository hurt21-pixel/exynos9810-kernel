name: Build Kernel S9 - Final Lineage 20
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: hurt21-pixel/Lineageos-android_kernel_samsung_exynos9810
          ref: lineage-20 # Sesuai dengan branch yang ada di repo kamu

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev lld llvm

      - name: Setup Clang 19 (Google Prebuilt)
        run: |
          mkdir -p clang-19
          curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang-19
          echo "$(pwd)/clang-19/bin" >> $GITHUB_PATH

      - name: Integrasi KernelSU Original
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          # Aktifkan KSU di defconfig starlte (S9)
          CONF=arch/arm64/configs/exynos9810-starlte_defconfig
          if [ -f $CONF ]; then
            echo "CONFIG_KPROBES=y" >> $CONF
            echo "CONFIG_KPROBE_EVENTS=y" >> $CONF
            echo "CONFIG_OVERLAY_FS=y" >> $CONF
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export PATH=$(pwd)/clang-19/bin:$PATH
          
          # Tentukan config
          if [ -f arch/arm64/configs/exynos9810-starlte_defconfig ]; then
            CONF=exynos9810-starlte_defconfig
          else
            CONF=universal9810_defconfig
          fi
          
          make O=out $CONF
          # PAKSA ENTER otomatis untuk menjawab fitur baru agar tidak 'Aborted'
          yes "" | make O=out oldconfig
          
          make -j$(nproc) O=out \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S9-Final-KSU
          path: out/arch/arm64/boot/Image.gz-dtb
          
